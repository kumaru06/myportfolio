<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mark Andrey Perez | AI Software Developer</title>
    <link rel="icon" type="image/png" href="/src/assets/images/logo/mp.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/src/assets/images/logo/mp.png" />
    <meta
      name="description"
      content="Personal portfolio of Mark Andrey Perez, AI and Software Developer."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
